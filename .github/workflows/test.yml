name: Tests and quality checks
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test:unit
      - run: yarn build
      - run: yarn test:build
      - run: yarn test:integration
